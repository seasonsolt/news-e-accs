<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d0a07">
  <title>时间隧道 1800–1844 — e/acc 场景原型</title>
  <link rel="icon" href="data:,">
  <style>
    :root{color-scheme:dark;--ink:#f3e9d2;--dim:#b9a782;--gold:#e2b867;--bg:#0d0a07;font-family:"Iowan Old Style","Songti SC",Georgia,serif}
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
    canvas{display:block;touch-action:none}
    .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 58%,#080604d9 100%)}
    .hud{position:fixed;left:48px;bottom:132px;max-width:520px;pointer-events:none;text-shadow:0 2px 18px #000c;transition:opacity .35s}
    .meta{font:12px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--gold)}
    .year{font-size:112px;line-height:1;font-style:italic;margin:6px 0 10px;font-variant-numeric:tabular-nums}
    .title{font-size:26px;margin:0 0 8px}.desc{font-size:15px;line-height:1.6;color:var(--dim);margin:0}
    .enter{pointer-events:auto;margin-top:18px;display:inline-flex;gap:10px;align-items:center;padding:10px 18px;border-radius:999px;border:1px solid var(--gold);background:#1a130bcc;color:var(--ink);font:inherit;font-size:15px;cursor:pointer;transition:background .2s,opacity .3s}
    .enter:hover{background:#2c2010}.enter:focus-visible{outline:2px solid var(--gold);outline-offset:4px}.enter[hidden]{display:none}.enter:disabled{opacity:.6;cursor:wait}
    .bar{position:fixed;left:48px;right:48px;bottom:36px;height:64px;user-select:none;cursor:pointer}
    .track{position:absolute;left:0;right:0;top:30px;height:1px;background:#e2b86759}
    .tick{position:absolute;top:22px;width:1px;height:17px;background:var(--gold);opacity:.55}
    .tick span{position:absolute;top:22px;left:50%;transform:translateX(-50%);font:11px ui-monospace,Menlo,monospace;color:var(--dim);white-space:nowrap}
    .tick.on{opacity:1}.tick.on span{color:var(--ink)}.tick.scene::after{content:"";position:absolute;left:-3px;top:-9px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
    .cursor{position:absolute;top:19px;width:23px;height:23px;margin-left:-11px;border-radius:50%;border:2px solid var(--gold);background:#e2b86740;box-shadow:0 0 18px #e2b8679a}
    .help{position:fixed;right:48px;top:28px;font:12px ui-monospace,Menlo,monospace;color:var(--dim);text-align:right;line-height:1.7}
    .chrome{transition:opacity .5s}.is-inside .chrome,.is-entering .chrome{opacity:0;pointer-events:none}
    #workshop{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;pointer-events:none;transition:opacity .8s ease;background:transparent}
    #workshop.is-open{opacity:1;pointer-events:auto}
    @media(max-width:640px){.hud{left:16px;right:16px;bottom:120px}.year{font-size:72px}.bar{left:16px;right:16px}.help{display:none}}
    @media(prefers-reduced-motion:reduce){#workshop,.chrome{transition:none}}
  </style>
  <script type="importmap">{"imports":{"three":"../difference-engine-1822/vendor/three.module.js"}}</script>
</head>
<body>
  <div class="vignette chrome"></div>
  <div class="help chrome">滚轮 / 拖动：穿越时间<br>← →：上一个 / 下一个里程碑<br>移动鼠标：环视画面</div>
  <div class="hud chrome" id="hud">
    <div class="meta" id="meta"></div>
    <div class="year" id="year"></div>
    <h1 class="title" id="title"></h1>
    <p class="desc" id="desc"></p>
    <button class="enter" id="enter" hidden>走进工坊 <span aria-hidden="true">→</span></button>
  </div>
  <div class="bar chrome" id="bar"><div class="track"></div><div class="cursor" id="cursor"></div></div>
  <script type="module" src="./tunnel.js"></script>
</body>
</html>
