# Shared by every eacc-*.service (a systemd prefix drop-in). /srv/eacc/app is a symlink to the live build;
# deploy/remote.sh switches it and writes each build's .release.env (AIHOT_RELEASE=<sha>).
[Service]
User=eacc
Group=eacc
WorkingDirectory=/srv/eacc/app
EnvironmentFile=/srv/eacc/.env
EnvironmentFile=-/srv/eacc/app/.release.env
Environment=NODE_ENV=production
Environment=PATH=/opt/node24/bin:/usr/bin:/bin
Environment=AIHOT_DATA_DIR=/srv/eacc/data
Environment=API_BASE_URL=http://127.0.0.1:3001
Environment=LOCAL_ROUTER_URL=http://127.0.0.1:3000
Restart=always
RestartSec=5
NoNewPrivileges=true
ProtectSystem=full
PrivateTmp=true
